<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه زمان‌سنجی انبار داروسازی</title>
  
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --disabled: #f1f5f9;
      --calc-bg: #eff6ff;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
    }

    .header h1 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 1.6rem;
    }

    .header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      background: #ffffff;
    }

    legend {
      font-weight: bold;
      color: var(--primary);
      padding: 0 10px;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .required::after {
      content: " *";
      color: #ef4444;
      font-weight: bold;
    }

    input, select, textarea {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text);
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    input:disabled, select:disabled {
      background-color: var(--disabled);
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
    }

    .checkbox-container input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .calculated-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed var(--border);
    }

    .calc-card {
      background: var(--calc-bg);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .calc-card label {
      display: block;
      margin-bottom: 4px;
      color: #1e40af;
      font-size: 0.8rem;
    }

    .calc-card span {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .alert {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
      text-align: center;
    }

    .alert-success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .alert-error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>سامانه جامع زمان‌سنجی انبار و توزین</h1>
    <p>ثبت شاخص‌های فرآیندی، محاسبات زمانی و توقفات خط تولید (تقویم میلادی)</p>
  </div>

  <div id="alertBox" class="alert"></div>

  <form id="timeStudyForm">
    
    <!-- ۱. اطلاعات پایه و مشخصات عملیات -->
    <fieldset>
      <legend>۱. اطلاعات پایه و مشخصات فرآیند</legend>
      <div class="grid">
        <div class="form-group">
          <label class="required">تاریخ عملیات (میلادی)</label>
          <input type="date" id="dateInput" name="date" required>
        </div>

        <div class="form-group">
          <label class="required">محل انجام عملیات</label>
          <select name="location" required>
            <option value="">-- انتخاب کنید --</option>
            <option value="API 1">API 1</option>
            <option value="API Samp">API Samp</option>
            <option value="EXP 1">EXP 1</option>
            <option value="EXP 2">EXP 2</option>
            <option value="EXP Samp">EXP Samp</option>
            <option value="انبار محصول نهایی">انبار محصول نهایی</option>
            <option value="سایر">سایر</option>
          </select>
        </div>

        <div class="form-group">
          <label class="required">شیفت کاری</label>
          <select name="shift" required>
            <option value="">-- انتخاب کنید --</option>
            <option value="روز">روز</option>
            <option value="شب">شب</option>
          </select>
        </div>

        <div class="form-group">
          <label class="required">نوع فرآیند</label>
          <select name="processType" id="processType" required onchange="handleProcessTypeChange()">
            <option value="">-- انتخاب کنید --</option>
            <option value="توزین مواد اولیه">توزین مواد اولیه</option>
            <option value="توزین اقلام بسته‌بندی">توزین اقلام بسته‌بندی</option>
            <option value="SUB&MAIN">SUB&MAIN</option>
            <option value="تمیزکاری تجهیز">تمیزکاری تجهیز</option>
            <option value="شستشوی اتاق">شستشوی اتاق</option>
            <option value="نمونه برداری">نمونه برداری</option>
            <option value="توزین درخواست">توزین درخواست</option>
            <option value="شرکت های همکار">شرکت های همکار</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblProductName">نام محصول</label>
          <input type="text" name="productName" id="productName" placeholder="نام محصول" disabled>
        </div>

        <div class="form-group">
          <label id="lblBatchNo">شماره بچ (Batch No)</label>
          <input type="text" name="batchNo" id="batchNo" placeholder="مثال: B2024-01" disabled>
        </div>

        <div class="form-group">
          <label id="lblBatchSize">اندازه بچ (Batch Size)</label>
          <input type="number" step="any" name="batchSize" id="batchSize" placeholder="مقدار عددی" disabled>
        </div>
      </div>
    </fieldset>

    <!-- ۲. پرسنل و اپراتورها -->
    <fieldset>
      <legend>۲. پرسنل و اپراتورهای حاضر</legend>
      <div class="grid">
        <div class="form-group">
          <label class="required">اپراتور ۱ (اصلی)</label>
          <select name="operator1" required>
            <option value="">-- انتخاب اپراتور --</option>
            <option value="کریمی پور">کریمی پور</option>
            <option value="اسکندرزاده">اسکندرزاده</option>
            <option value="پاشایی">پاشایی</option>
            <option value="آبکتی">آبکتی</option>
            <option value="فرجی">فرجی</option>
            <option value="دشتی">دشتی</option>
            <option value="حمزه خانی">حمزه خانی</option>
            <option value="نیروی کمکی">نیروی کمکی</option>
          </select>
          <label class="checkbox-container">
            <input type="checkbox" id="hasHelper1" onchange="toggleHelper(1)"> دارای نیروی کمکی
          </label>
        </div>

        <div class="form-group">
          <label>نام کمکی اپراتور ۱</label>
          <input type="text" name="opHelper1" id="opHelper1" placeholder="نام نیروی کمکی ۱" disabled>
        </div>

        <div class="form-group">
          <label>اپراتور ۲</label>
          <select name="operator2">
            <option value="">-- انتخاب اپراتور --</option>
            <option value="کریمی پور">کریمی پور</option>
            <option value="اسکندرزاده">اسکندرزاده</option>
            <option value="پاشایی">پاشایی</option>
            <option value="آبکتی">آبکتی</option>
            <option value="فرجی">فرجی</option>
            <option value="دشتی">دشتی</option>
            <option value="حمزه خانی">حمزه خانی</option>
            <option value="نیروی کمکی">نیروی کمکی</option>
          </select>
          <label class="checkbox-container">
            <input type="checkbox" id="hasHelper2" onchange="toggleHelper(2)"> دارای نیروی کمکی
          </label>
        </div>

        <div class="form-group">
          <label>نام کمکی اپراتور ۲</label>
          <input type="text" name="opHelper2" id="opHelper2" placeholder="نام نیروی کمکی ۲" disabled>
        </div>

        <div class="form-group">
          <label>سرپرست / ناظر شیفت</label>
          <input type="text" name="supervisor" placeholder="نام سرپرست">
        </div>
      </div>
    </fieldset>

    <!-- ۳. خط زمانی فرآیند و توقفات -->
    <fieldset>
      <legend>۳. زمان‌سنجی فرآیند و توقفات (تایم استادی)</legend>
      <div class="grid-4">
        <div class="form-group">
          <label>شروع آماده‌سازی (Line Clearance)</label>
          <input type="time" name="prepStart" id="prepStart" class="calc-input">
        </div>
        <div class="form-group">
          <label>پایان آماده‌سازی</label>
          <input type="time" name="prepEnd" id="prepEnd" class="calc-input">
        </div>
        <div class="form-group">
          <label class="required">شروع عملیات اصلی</label>
          <input type="time" name="procStart" id="procStart" class="calc-input" required>
        </div>
        <div class="form-group">
          <label class="required">پایان عملیات اصلی</label>
          <input type="time" name="procEnd" id="procEnd" class="calc-input" required>
        </div>
      </div>

      <!-- توقفات -->
      <div style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px;">
        <label style="font-weight: bold; color: var(--primary); display: block; margin-bottom: 10px;">ثبت توقفات حین کار (Down Times):</label>
        
        <!-- توقف ۱ -->
        <div class="grid">
          <div class="form-group">
            <label>شروع توقف ۱</label>
            <input type="time" name="stop1Start" id="stop1Start" class="calc-input">
          </div>
          <div class="form-group">
            <label>پایان توقف ۱</label>
            <input type="time" name="stop1End" id="stop1End" class="calc-input">
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label>علت توقف ۱</label>
            <input type="text" name="stop1Reason" placeholder="مثال: اشکال در ترازو، تأخیر در دریافت بچ رکورد">
          </div>
        </div>

        <!-- توقف ۲ -->
        <div class="grid" style="margin-top: 10px;">
          <div class="form-group">
            <label>شروع توقف ۲</label>
            <input type="time" name="stop2Start" id="stop2Start" class="calc-input">
          </div>
          <div class="form-group">
            <label>پایان توقف ۲</label>
            <input type="time" name="stop2End" id="stop2End" class="calc-input">
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label>علت توقف ۲</label>
            <input type="text" name="stop2Reason" placeholder="علت توقف دوم">
          </div>
        </div>

        <!-- توقف ۳ -->
        <div class="grid" style="margin-top: 10px;">
          <div class="form-group">
            <label>شروع توقف ۳</label>
            <input type="time" name="stop3Start" id="stop3Start" class="calc-input">
          </div>
          <div class="form-group">
            <label>پایان توقف ۳</label>
            <input type="time" name="stop3End" id="stop3End" class="calc-input">
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label>علت توقف ۳</label>
            <input type="text" name="stop3Reason" placeholder="علت توقف سوم">
          </div>
        </div>
      </div>

      <!-- زمان‌های جانبی -->
      <div style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px;">
        <label style="font-weight: bold; color: var(--primary); display: block; margin-bottom: 10px;">زمان‌های جانبی (دقیقه):</label>
        <div class="grid-3">
          <div class="form-group">
            <label>مدت زمان حضور و چک QC</label>
            <input type="number" step="any" name="qcDuration" id="qcDuration" placeholder="دقیقه">
          </div>
          <div class="form-group">
            <label>مدت انتقال به بخش ساخت</label>
            <input type="number" step="any" name="transferDuration" id="transferDuration" placeholder="دقیقه">
          </div>
          <div class="form-group">
            <label>مدت معطلی در باجه انتظار (Staging)</label>
            <input type="number" step="any" name="stagingWaitDuration" id="stagingWaitDuration" placeholder="دقیقه">
          </div>
        </div>
      </div>

      <!-- باکس‌های محاسباتی -->
      <div class="calculated-row">
        <div class="calc-card">
          <label>مدت آماده‌سازی (دقیقه)</label>
          <span id="dispPrep">0</span>
        </div>
        <div class="calc-card">
          <label>کل زمان سپری‌شده (دقیقه)</label>
          <span id="dispTotal">0</span>
        </div>
        <div class="calc-card">
          <label>مجموع توقفات (دقیقه)</label>
          <span id="dispStops">0</span>
        </div>
        <div class="calc-card" style="background: #dcfce7; border-color: #86efac;">
          <label style="color: #15803d;">زمان خالص فرآیند (دقیقه)</label>
          <span id="dispNet" style="color: #15803d;">0</span>
        </div>
      </div>
    </fieldset>

    <!-- ۴. توضیحات و انحرافات -->
    <fieldset>
      <legend>۴. توضیحات و مغایرت‌ها (Remarks & Deviations)</legend>
      <div class="form-group">
        <label>توضیحات تکمیلی یا هرگونه رویداد خارج از استاندارد</label>
        <textarea name="remarks" rows="3" placeholder="توضیحات مربوط به شرایط محیطی، مغایرت در بچ یا هر نکته ضروری..."></textarea>
      </div>
    </fieldset>

    <button type="submit" id="btnSubmit" class="btn-submit">ثبت نهایی در گوگل‌شیت</button>
  </form>
</div>

<script>
  // آدرس وب‌اپ گوگل‌اسکریپت خود را در خط زیر قرار دهید
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHidMYb-JBYmpBTdhy3Le68-vaqtNwrD-M9IcOYw8AYeBVNKC6CG4tsbavsDFAJxH9hw/exec";

  // مقداردهی تاریخ امروز بر اساس تقویم میلادی
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;
  });

  // کنترل فعال/غیرفعال بودن فیلدهای نام محصول، شماره بچ و اندازه بچ
  function handleProcessTypeChange() {
    const val = document.getElementById('processType').value;
    const isSpecial = ['توزین مواد اولیه', 'توزین اقلام بسته‌بندی', 'SUB&MAIN'].includes(val);
    const fields = ['productName', 'batchNo', 'batchSize'];

    fields.forEach(fId => {
      const el = document.getElementById(fId);
      const lbl = document.getElementById('lbl' + fId.charAt(0).toUpperCase() + fId.slice(1));
      
      el.disabled = !isSpecial;
      el.required = isSpecial;
      if (!isSpecial) {
        el.value = '';
        if (lbl) lbl.classList.remove('required');
      } else {
        if (lbl) lbl.classList.add('required');
      }
    });
  }

  // فعال/غیرفعال کردن فیلدهای نیروی کمکی
  function toggleHelper(idx) {
    const chk = document.getElementById('hasHelper' + idx);
    const input = document.getElementById('opHelper' + idx);
    input.disabled = !chk.checked;
    if (!chk.checked) input.value = '';
  }

  // تبدیل فرمت HH:MM به دقیقه
  function toMinutes(t) {
    if (!t) return 0;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  // محاسبه اختلاف زمانی با پشتیبانی از عبور نیمه‌شب
  function diffMinutes(start, end) {
    if (!start || !end) return 0;
    let d = toMinutes(end) - toMinutes(start);
    if (d < 0) d += 1440;
    return d;
  }

  // محاسبه لحظه‌ای زمان‌ها
  function calculateTimes() {
    const prep = diffMinutes(document.getElementById('prepStart').value, document.getElementById('prepEnd').value);
    const total = diffMinutes(document.getElementById('procStart').value, document.getElementById('procEnd').value);

    const s1 = diffMinutes(document.getElementById('stop1Start').value, document.getElementById('stop1End').value);
    const s2 = diffMinutes(document.getElementById('stop2Start').value, document.getElementById('stop2End').value);
    const s3 = diffMinutes(document.getElementById('stop3Start').value, document.getElementById('stop3End').value);

    const totalStops = s1 + s2 + s3;
    let net = total - totalStops;
    if (net < 0) net = 0;

    document.getElementById('dispPrep').innerText = prep;
    document.getElementById('dispTotal').innerText = total;
    document.getElementById('dispStops').innerText = totalStops;
    document.getElementById('dispNet').innerText = net;
  }

  // اتصال شنونده رویداد به تمام ورودی‌های زمان
  document.querySelectorAll('.calc-input').forEach(el => {
    el.addEventListener('input', calculateTimes);
  });

  // ثبت و ارسال فرم
  document.getElementById('timeStudyForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const alertBox = document.getElementById('alertBox');

    btn.disabled = true;
    btn.innerText = "در حال ارسال به گوگل‌شیت...";

    const formData = new FormData(this);
    const payload = Object.fromEntries(formData.entries());

    // تزریق فیلدهای محاسباتی به پی‌لود ارسالی
    payload.prepDuration = document.getElementById('dispPrep').innerText;
    payload.totalDuration = document.getElementById('dispTotal').innerText;
    payload.totalStops = document.getElementById('dispStops').innerText;
    payload.netDuration = document.getElementById('dispNet').innerText;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      cache: 'no-cache',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alertBox.style.display = "block";
      alertBox.className = "alert alert-success";
      alertBox.innerText = "اطلاعات با موفقیت در گوگل‌شیت ثبت گردید.";

      this.reset();
      document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
      calculateTimes();
      handleProcessTypeChange();

      btn.disabled = false;
      btn.innerText = "ثبت نهایی در گوگل‌شیت";

      setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
    })
    .catch(err => {
      alertBox.style.display = "block";
      alertBox.className = "alert alert-error";
      alertBox.innerText = "خطا در ارسال داده‌ها: " + err.message;
      btn.disabled = false;
      btn.innerText = "ثبت نهایی در گوگل‌شیت";
    });
  });
</script>
</body>
</html>
