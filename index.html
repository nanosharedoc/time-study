<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه ثبت زمان‌سنجی انبار دارویی</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
            padding: 20px 10px;
        }
        .main-card {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 25px;
        }
        .login-card {
            max-width: 400px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .section-header {
            background-color: #e9ecef;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 12px;
            color: #495057;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- صفحه ورود (Login) -->
    <div id="loginSection" class="login-card">
        <h4 class="text-center mb-3 text-primary">ورود به سامانه زمان‌سنجی</h4>
        <p class="text-muted text-center small mb-4">انبار مرکزی شرکت داروسازی</p>
        
        <div id="loginError" class="alert alert-danger d-none py-2 text-center" role="alert">
            کد اپراتور یا رمز عبور نامعتبر است!
        </div>

        <div class="mb-3">
            <label class="form-label">کد اپراتور:</label>
            <input type="text" id="username" class="form-control text-center" placeholder="مثال: 101" autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label">رمز عبور:</label>
            <input type="password" id="password" class="form-control text-center" placeholder="****">
        </div>
        <button type="button" class="btn btn-primary w-100 py-2" onclick="login()">ورود به برنامه</button>
    </div>

    <!-- فرم اصلی ثبت داده (بعد از لاگین نمایان می‌شود) -->
    <div id="formSection" class="main-card d-none">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <div>
                <h5 class="m-0 text-primary">فرم ثبت زمان‌سنجی توزین و انتقال</h5>
                <small class="text-muted">اپراتور فعال: <span id="operatorDisplay" class="fw-bold text-dark"></span></small>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">خروج</button>
        </div>

        <form id="timeStudyForm" onsubmit="submitData(event)">
            <!-- بخش ۱: اطلاعات پایه سفارش -->
            <div class="section-header">۱. اطلاعات سفارش و متریال</div>
            <div class="row g-2">
                <div class="col-md-4">
                    <label class="form-label small">شماره بچ (Batch No):</label>
                    <input type="text" id="batchNo" class="form-control form-control-sm" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">نام متریال / ماده اولیه:</label>
                    <input type="text" id="materialName" class="form-control form-control-sm" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">کد آرتیکل (Material Code):</label>
                    <input type="text" id="materialCode" class="form-control form-control-sm" required>
                </div>
            </div>

            <!-- بخش ۲: زمان‌سنجی مراحل فرآیند -->
            <div class="section-header">۲. ثبت زمان‌های فرآیندی (ساعت دقیق)</div>
            <div class="row g-2">
                <div class="col-6 col-md-3">
                    <label class="form-label small">شروع آماده‌سازی:</label>
                    <input type="time" id="tPrepStart" class="form-control form-control-sm" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small">پایان آماده‌سازی:</label>
                    <input type="time" id="tPrepEnd" class="form-control form-control-sm" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small">شروع نمونه‌برداری/QC:</label>
                    <input type="time" id="tQcStart" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small">تایید QC:</label>
                    <input type="time" id="tQcEnd" class="form-control form-control-sm">
                </div>
            </div>

            <div class="row g-2 mt-1">
                <div class="col-6 col-md-3">
                    <label class="form-label small">شروع عملیات توزین:</label>
                    <input type="time" id="tWeighStart" class="form-control form-control-sm" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small">پایان عملیات توزین:</label>
                    <input type="time" id="tWeighEnd" class="form-control form-control-sm" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small">شروع نظافت/Line Clearance:</label>
                    <input type="time" id="tCleanStart" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small">پایان نظافت:</label>
                    <input type="time" id="tCleanEnd" class="form-control form-control-sm">
                </div>
            </div>

            <!-- بخش ۳: توضیحات و انحرافات -->
            <div class="section-header">۳. توضیحات و توقفات (اختیاری)</div>
            <div class="mb-3">
                <textarea id="notes" class="form-control form-control-sm" rows="2" placeholder="علت تأخیر، ویسکوزیته بالای ماده، تعویض پک و..."></textarea>
            </div>

            <div id="submitStatus" class="alert d-none py-2 text-center small mb-3"></div>

            <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2">
                ثبت و ارسال به دیتابیس شیت
            </button>
        </form>
    </div>

    <script>
        // پایگاه داده کاربران محلی
        const USERS_DB = {
            "101": { pass: "1234", name: "میثم (سرپرست انبار)" },
            "102": { pass: "1234", name: "اپراتور توزین ۱" },
            "103": { pass: "1234", name: "اپراتور توزین ۲" }
        };

        let currentOperator = null;

        // تابع ورود
        function login() {
            const userInp = document.getElementById("username").value.trim();
            const passInp = document.getElementById("password").value.trim();
            const errAlert = document.getElementById("loginError");

            if (USERS_DB[userInp] && USERS_DB[userInp].pass === passInp) {
                currentOperator = USERS_DB[userInp].name;
                errAlert.classList.add("d-none");
                document.getElementById("loginSection").classList.add("d-none");
                document.getElementById("formSection").classList.remove("d-none");
                document.getElementById("operatorDisplay").innerText = currentOperator;
            } else {
                errAlert.classList.remove("d-none");
            }
        }

        // تابع خروج
        function logout() {
            currentOperator = null;
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            document.getElementById("formSection").classList.add("d-none");
            document.getElementById("loginSection").classList.remove("d-none");
        }

        // آدرس Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_YOUR_REAL_DEPLOYMENT_ID/exec";

        // تابع ارسال داده
        async function submitData(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const statusDiv = document.getElementById("submitStatus");

            submitBtn.disabled = true;
            submitBtn.innerText = "در حال ارسال اطلاعات...";
            statusDiv.className = "alert alert-info py-2 text-center small";
            statusDiv.innerText = "ارتباط با سرور در حال برقراری است...";
            statusDiv.classList.remove("d-none");

            const payload = {
                operator: currentOperator,
                batchNo: document.getElementById("batchNo").value,
                materialName: document.getElementById("materialName").value,
                materialCode: document.getElementById("materialCode").value,
                prepStart: document.getElementById("tPrepStart").value,
                prepEnd: document.getElementById("tPrepEnd").value,
                qcStart: document.getElementById("tQcStart").value,
                qcEnd: document.getElementById("tQcEnd").value,
                weighStart: document.getElementById("tWeighStart").value,
                weighEnd: document.getElementById("tWeighEnd").value,
                cleanStart: document.getElementById("tCleanStart").value,
                cleanEnd: document.getElementById("tCleanEnd").value,
                notes: document.getElementById("notes").value,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                statusDiv.className = "alert alert-success py-2 text-center small";
                statusDiv.innerText = "اطلاعات با موفقیت ثبت شد ✅";
                document.getElementById("timeStudyForm").reset();
            } catch (err) {
                statusDiv.className = "alert alert-danger py-2 text-center small";
                statusDiv.innerText = "خطا در ارتباط با سرور گوگل! لطفاً اینترنت را بررسی کنید.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "ثبت و ارسال به دیتابیس شیت";
            }
        }
    </script>
</body>
</html>
