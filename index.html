<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه جامع زمان‌سنجی انبار داروسازی</title>
  
  <!-- Persian Datepicker CDN -->
  <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

  <style>
    :root {
      --primary-color: #1e3a8a;
      --primary-light: #3b82f6;
      --accent-color: #10b981;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --disabled-bg: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 1050px; margin: 0 auto; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 30px; }
    
    .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
    .header h1 { margin: 0; color: var(--primary-color); font-size: 1.7rem; }
    .header p { margin: 5px 0 0; color: var(--text-muted); font-size: 0.95rem; }

    fieldset { border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; margin-bottom: 25px; background: #fafafa; }
    legend { font-weight: bold; color: var(--primary-color); padding: 0 10px; font-size: 1.05rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }

    .form-group { display: flex; flex-direction: column; }
    label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .required::after { content: " *"; color: #ef4444; font-weight: bold; }

    input, select {
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      background-color: #fff;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    input:disabled, select:disabled {
      background-color: var(--disabled-bg);
      cursor: not-allowed;
      opacity: 0.7;
      border-color: #cbd5e1;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 0.8rem;
      color: #475569;
    }
    .checkbox-container input { width: 16px; height: 16px; cursor: pointer; }

    .calculated-box {
      background: #eff6ff;
      border: 1px dashed var(--primary-light);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .calculated-box label { color: var(--primary-color); }
    .calculated-box span { font-size: 1.1rem; font-weight: bold; color: #1e3a8a; display: block; margin-top: 4px; }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    .alert { display: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
    .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>سامانه زمان‌سنجی انبار و توزین داروسازی</h1>
    <p>ثبت دقیق پارامترهای فرآیندی و محاسبات خط زمانی تولید</p>
  </div>

  <div id="alertBox" class="alert"></div>

  <form id="timeStudyForm">
    <!-- بخش اطلاعات پایه -->
    <fieldset>
      <legend>اطلاعات پایه و مشخصات عملیات</legend>
      <div class="grid">
        <div class="form-group">
          <label class="required">تاریخ عملیات</label>
          <input type="text" id="dateInput" name="date" class="pdate" required autocomplete="off" placeholder="انتخاب تاریخ...">
        </div>

        <div class="form-group">
          <label class="required">محل انجام عملیات (اتاق/انبار)</label>
          <select name="location" required>
            <option value="">-- انتخاب کنید --</option>
            <option value="کلین‌روم ۱ (توزین مواد موثره)">کلین‌روم ۱ (توزین مواد موثره)</option>
            <option value="کلین‌روم ۲ (توزین جانبی)">کلین‌روم ۲ (توزین جانبی)</option>
            <option value="انبار مرکزی مواد اولیه">انبار مرکزی مواد اولیه</option>
            <option value="انبار ملزومات بسته‌بندی">انبار ملزومات بسته‌بندی</option>
            <option value="انبار قرنطینه">انبار قرنطینه</option>
          </select>
        </div>

        <div class="form-group">
          <label class="required">شیفت کاری</label>
          <select name="shift" required>
            <option value="">-- انتخاب کنید --</option>
            <option value="صبح">صبح</option>
            <option value="عصر">عصر</option>
            <option value="شب">شب</option>
          </select>
        </div>

        <div class="form-group">
          <label class="required">نوع فرآیند</label>
          <select name="processType" id="processType" required onchange="handleProcessTypeChange()">
            <option value="">-- انتخاب کنید --</option>
            <option value="توزین مواد اولیه">توزین مواد اولیه</option>
            <option value="توزین اقلام بسته‌بندی">توزین اقلام بسته‌بندی</option>
            <option value="SUB&MAIN">SUB&MAIN</option>
            <option value="انتقال و تحویل‌دهی">انتقال و تحویل‌دهی</option>
            <option value="تمیزکاری خط و فضا">تمیزکاری خط و فضا</option>
            <option value="سایر فرآیندها">سایر فرآیندها</option>
          </select>
        </div>
      </div>

      <div class="grid" style="margin-top: 15px;">
        <div class="form-group">
          <label id="lblProductName" class="required">نام محصول</label>
          <select name="productName" id="productName" required>
            <option value="">-- انتخاب محصول --</option>
            <option value="قرص استامینوفن ۵۰۰">قرص استامینوفن ۵۰۰</option>
            <option value="کپسول آموکسی‌سیلین ۵۰۰">کپسول آموکسی‌سیلین ۵۰۰</option>
            <option value="شربت ایبوپروفن">شربت ایبوپروفن</option>
            <option value="قطره چشمی سیپروفلوکساسین">قطره چشمی سیپروفلوکساسین</option>
            <option value="قرص متفورمین ۵۰۰">قرص متفورمین ۵۰۰</option>
            <option value="سایر محصولات">سایر محصولات</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblBatchNo" class="required">شماره بچ (Batch No)</label>
          <input type="text" name="batchNo" id="batchNo" required placeholder="مثال: B-030801">
        </div>

        <div class="form-group">
          <label id="lblBatchSize" class="required">بچ سایز (فقط عدد - کیلوگرم/عدد)</label>
          <input type="number" name="batchSize" id="batchSize" min="0" step="any" required placeholder="مثال: 150">
        </div>

        <div class="form-group">
          <label class="required">نام کاربر ثبت‌کننده</label>
          <input type="text" name="username" required placeholder="نام و نام خانوادگی">
        </div>
      </div>
    </fieldset>

    <!-- بخش تیم اجرایی و اپراتورها -->
    <fieldset>
      <legend>تیم اجرایی و اپراتورها</legend>
      <div class="grid">
        <div class="form-group">
          <label class="required">اپراتور ۱ (توزین‌کار اصلی)</label>
          <select name="op1" required>
            <option value="">-- انتخاب اپراتور ۱ --</option>
            <option value="اپراتور ۱">اپراتور ۱</option>
            <option value="اپراتور ۲">اپراتور ۲</option>
            <option value="اپراتور ۳">اپراتور ۳</option>
            <option value="اپراتور ۴">اپراتور ۴</option>
          </select>
        </div>

        <div class="form-group">
          <label>اپراتور ۲</label>
          <select name="op2">
            <option value="">-- فاقد اپراتور ۲ --</option>
            <option value="اپراتور ۱">اپراتور ۱</option>
            <option value="اپراتور ۲">اپراتور ۲</option>
            <option value="اپراتور ۳">اپراتور ۳</option>
            <option value="اپراتور ۴">اپراتور ۴</option>
          </select>
          <div class="checkbox-container">
            <input type="checkbox" id="hasHelper2" onchange="toggleHelper('hasHelper2', 'opHelper2')">
            <label for="hasHelper2">دارای نیروی کمکی برای اپراتور ۲</label>
          </div>
        </div>

        <div class="form-group">
          <label>نام نیروی کمکی اپراتور ۲</label>
          <input type="text" name="opHelper2" id="opHelper2" disabled placeholder="نام کمکی ۲...">
        </div>

        <div class="form-group">
          <label>اپراتور ۳</label>
          <select name="op3">
            <option value="">-- فاقد اپراتور ۳ --</option>
            <option value="اپراتور ۱">اپراتور ۱</option>
            <option value="اپراتور ۲">اپراتور ۲</option>
            <option value="اپراتور ۳">اپراتور ۳</option>
            <option value="اپراتور ۴">اپراتور ۴</option>
          </select>
          <div class="checkbox-container">
            <input type="checkbox" id="hasHelper3" onchange="toggleHelper('hasHelper3', 'opHelper3')">
            <label for="hasHelper3">دارای نیروی کمکی برای اپراتور ۳</label>
          </div>
        </div>

        <div class="form-group">
          <label>نام نیروی کمکی اپراتور ۳</label>
          <input type="text" name="opHelper3" id="opHelper3" disabled placeholder="نام کمکی ۳...">
        </div>
      </div>
    </fieldset>

    <!-- بخش ثبت زمان‌های فرآیندی -->
    <fieldset>
      <legend>زمان‌های فرآیندی (فرمت 24 ساعته)</legend>
      <div class="grid-4">
        <div class="form-group">
          <label>شروع آماده‌سازی</label>
          <input type="time" name="prepStart" id="prepStart" class="time-calc">
        </div>
        <div class="form-group">
          <label>پایان آماده‌سازی</label>
          <input type="time" name="prepEnd" id="prepEnd" class="time-calc">
        </div>
        <div class="form-group">
          <label>شروع نمونه‌برداری / QC</label>
          <input type="time" name="qcStart" id="qcStart" class="time-calc">
        </div>
        <div class="form-group">
          <label>پایان نمونه‌برداری / QC</label>
          <input type="time" name="qcEnd" id="qcEnd" class="time-calc">
        </div>
      </div>

      <div class="grid-4" style="margin-top: 15px;">
        <div class="form-group">
          <label>شروع انتقال اقلام</label>
          <input type="time" name="transStart" id="transStart" class="time-calc">
        </div>
        <div class="form-group">
          <label>پایان انتقال اقلام</label>
          <input type="time" name="transEnd" id="transEnd" class="time-calc">
        </div>
        <div class="form-group">
          <label class="required">شروع فرآیند اصلی</label>
          <input type="time" name="procStart" id="procStart" class="time-calc" required>
        </div>
        <div class="form-group">
          <label class="required">پایان فرآیند اصلی</label>
          <input type="time" name="procEnd" id="procEnd" class="time-calc" required>
        </div>
      </div>
    </fieldset>

    <!-- بخش توقفات -->
    <fieldset>
      <legend>توقفات و تاخیرات فرآیند</legend>
      <div class="grid">
        <div class="form-group">
          <label>شروع توقف ۱</label>
          <input type="time" name="stop1Start" id="stop1Start" class="time-calc">
        </div>
        <div class="form-group">
          <label>پایان توقف ۱</label>
          <input type="time" name="stop1End" id="stop1End" class="time-calc">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>علت توقف ۱</label>
          <input type="text" name="stop1Reason" placeholder="مثال: کالیبراسیون ترازو، عدم تایید مستندات...">
        </div>
      </div>

      <div class="grid" style="margin-top: 10px;">
        <div class="form-group">
          <label>شروع توقف ۲</label>
          <input type="time" name="stop2Start" id="stop2Start" class="time-calc">
        </div>
        <div class="form-group">
          <label>پایان توقف ۲</label>
          <input type="time" name="stop2End" id="stop2End" class="time-calc">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>علت توقف ۲</label>
          <input type="text" name="stop2Reason" placeholder="علت توقف دوم...">
        </div>
      </div>

      <div class="grid" style="margin-top: 10px;">
        <div class="form-group">
          <label>شروع توقف ۳</label>
          <input type="time" name="stop3Start" id="stop3Start" class="time-calc">
        </div>
        <div class="form-group">
          <label>پایان توقف ۳</label>
          <input type="time" name="stop3End" id="stop3End" class="time-calc">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label>علت توقف ۳</label>
          <input type="text" name="stop3Reason" placeholder="علت توقف سوم...">
        </div>
      </div>
    </fieldset>

    <!-- محاسبات لحظه‌ای و هوشمند -->
    <fieldset>
      <legend>محاسبات خودکار مدت زمان‌ها (دقیقه)</legend>
      <div class="grid">
        <div class="calculated-box">
          <label>مدت آماده‌سازی</label>
          <span id="dispPrep">۰</span>
        </div>
        <div class="calculated-box">
          <label>مدت زمان QC</label>
          <span id="dispQC">۰</span>
        </div>
        <div class="calculated-box">
          <label>مدت انتقال</label>
          <span id="dispTrans">۰</span>
        </div>
        <div class="calculated-box">
          <label>مدت کل فرآیند</label>
          <span id="dispProc">۰</span>
        </div>
        <div class="calculated-box" style="border-color: #10b981; background: #ecfdf5;">
          <label style="color: #065f46;">زمان مفید خالص</label>
          <span id="dispNet" style="color: #047857;">۰</span>
        </div>
      </div>
    </fieldset>

    <button type="submit" id="btnSubmit" class="btn-submit">ثبت نهایی و ارسال به پایگاه داده</button>
  </form>
</div>

<script>
  // آدرس اتصال به Google Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyf2pX36Fz25qWl3l-mX-ZgR_v_7Vn8E8/exec"; // لینک خودت را جایگزین کن

  $(document).ready(function() {
    // فعال‌سازی تقویم پاپ‌آپ شمسی
    $(".pdate").pDatepicker({
      format: 'YYYY/MM/DD',
      autoClose: true,
      initialValue: true,
      persianDigit: false
    });
  });

  // کنترل فعال/غیرفعال بودن نیروی کمکی
  function toggleHelper(chkId, inputId) {
    const chk = document.getElementById(chkId);
    const input = document.getElementById(inputId);
    input.disabled = !chk.checked;
    if (!chk.checked) input.value = "";
  }

  // منطق کنترل نوع فرآیند
  function handleProcessTypeChange() {
    const pType = document.getElementById('processType').value;
    const allowedTypes = ['توزین مواد اولیه', 'توزین اقلام بسته‌بندی', 'SUB&MAIN'];
    const isSpecial = allowedTypes.includes(pType);

    const fields = [
      { el: document.getElementById('productName'), lbl: document.getElementById('lblProductName') },
      { el: document.getElementById('batchNo'), lbl: document.getElementById('lblBatchNo') },
      { el: document.getElementById('batchSize'), lbl: document.getElementById('lblBatchSize') },
      { el: document.getElementById('prepStart'), lbl: null },
      { el: document.getElementById('prepEnd'), lbl: null },
      { el: document.getElementById('qcStart'), lbl: null },
      { el: document.getElementById('qcEnd'), lbl: null },
      { el: document.getElementById('transStart'), lbl: null },
      { el: document.getElementById('transEnd'), lbl: null }
    ];

    fields.forEach(f => {
      f.el.disabled = !isSpecial;
      if (!isSpecial) {
        f.el.value = "";
        f.el.removeAttribute('required');
        if (f.lbl) f.lbl.classList.remove('required');
      } else {
        if (['productName', 'batchNo', 'batchSize'].includes(f.el.id)) {
          f.el.setAttribute('required', 'required');
          if (f.lbl) f.lbl.classList.add('required');
        }
      }
    });

    calculateAll();
  }

  // محاسبه اختلاف دو زمان به دقیقه (با هندلینگ نیمه‌شب)
  function diffMinutes(start, end) {
    if (!start || !end) return 0;
    const [h1, m1] = start.split(':').map(Number);
    const [h2, m2] = end.split(':').map(Number);
    let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (diff < 0) diff += 24 * 60; // عبور از ۲۴:۰۰
    return diff;
  }

  // محاسبه کلیه زمان‌ها
  function calculateAll() {
    const durPrep = diffMinutes($('#prepStart').val(), $('#prepEnd').val());
    const durQC = diffMinutes($('#qcStart').val(), $('#qcEnd').val());
    const durTrans = diffMinutes($('#transStart').val(), $('#transEnd').val());
    const durProc = diffMinutes($('#procStart').val(), $('#procEnd').val());

    // مجموع توقفات
    const s1 = diffMinutes($('#stop1Start').val(), $('#stop1End').val());
    const s2 = diffMinutes($('#stop2Start').val(), $('#stop2End').val());
    const s3 = diffMinutes($('#stop3Start').val(), $('#stop3End').val());
    const totalStops = s1 + s2 + s3;

    let durNet = durProc - totalStops;
    if (durNet < 0) durNet = 0;

    $('#dispPrep').text(durPrep);
    $('#dispQC').text(durQC);
    $('#dispTrans').text(durTrans);
    $('#dispProc').text(durProc);
    $('#dispNet').text(durNet);

    return { durPrep, durQC, durTrans, durProc, durNet };
  }

  $('.time-calc').on('input change', calculateAll);

  // ارسال فرم
  $('#timeStudyForm').on('submit', function(e) {
    e.preventDefault();
    const btn = $('#btnSubmit');
    const alertBox = $('#alertBox');

    btn.prop('disabled', true).text('در حال ثبت و ارسال اطلاعات...');
    alertBox.hide().removeClass('alert-success alert-error');

    const durations = calculateAll();
    const formData = {};

    // جمع‌آوری تمام داده‌ها
    $(this).serializeArray().forEach(item => {
      formData[item.name] = item.value;
    });

    // مقادیر اینپوت‌های غیرفعال را هم اگر بود با رشته خالی هندل می‌کنیم
    if (!formData.opHelper2) formData.opHelper2 = $('#opHelper2').val() || "";
    if (!formData.opHelper3) formData.opHelper3 = $('#opHelper3').val() || "";
    if (!formData.productName) formData.productName = $('#productName').val() || "";
    if (!formData.batchNo) formData.batchNo = $('#batchNo').val() || "";
    if (!formData.batchSize) formData.batchSize = $('#batchSize').val() || "";

    // الحاق مقادیر محاسباتی
    Object.assign(formData, durations);

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alertBox.addClass('alert-success').text('اطلاعات با موفقیت در ردیف ' + data.row + ' پایگاه داده ثبت شد.').show();
        $('#timeStudyForm')[0].reset();
        calculateAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        throw new Error(data.message || 'خطا در ثبت اطلاعات');
      }
    })
    .catch(err => {
      alertBox.addClass('alert-error').text('خطا در ارسال: ' + err.message).show();
    })
    .finally(() => {
      btn.prop('disabled', false).text('ثبت نهایی و ارسال به پایگاه داده');
    });
  });
</script>

</body>
</html>
